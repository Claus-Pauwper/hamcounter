<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Per Day Counter</title>
<style>
  :root {
    --bg-blue: #1a3c6e;
    --dot-pink: #ff6fb0;
    --star-yellow: #ffdd55;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-blue);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  body {
    padding-top: 90px; /* leaves room for the fixed info window */
    overflow-x: hidden;
  }

  #info-window {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.92);
    color: #1a3c6e;
    padding: 10px 22px;
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    z-index: 10;
    letter-spacing: 0.3px;
  }

  #info-window .big {
    font-size: 18px;
    font-weight: 800;
  }

  #dot-canvas {
    display: block;
    margin: 0 auto;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="info-window">
  <div id="week-year-line">Week -- · ----</div>
  <div class="big" id="number-line">-- per day</div>
</div>

<canvas id="dot-canvas"></canvas>

<script>
  /* =========================================================
     WEEKLY NUMBER CONFIGURATION
     -------------------------------------------------------
     Add one line per week using the ISO week key "YYYY-Www".
     The starting value below is 222540 / 7, rounded = 31791.
     This number ALSO controls how many dots are drawn.

     To update weekly:
       1. Work out your new number.
       2. Find the current ISO week key (shown in the box on
          the page itself, e.g. "2026-W28").
       3. Add a new line to WEEKLY_DATA, e.g.:
             "2026-W28": 30000,
       4. Commit and push to GitHub. Done.

     If a week has no entry, DEFAULT_NUMBER is used instead.
     ========================================================= */
  const WEEKLY_DATA = {
    "2026-W27": 31791   // 222540 / 7 rounded, starting value
  };
  const DEFAULT_NUMBER = 31791;

  function getISOWeekInfo(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const dayNum = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    return { year: d.getUTCFullYear(), week: weekNo };
  }

  function pad(n) {
    return n.toString().padStart(2, "0");
  }

  function getCurrentNumber() {
    const now = new Date();
    const { year, week } = getISOWeekInfo(now);
    const key = `${year}-W${pad(week)}`;
    const number = WEEKLY_DATA[key] !== undefined ? WEEKLY_DATA[key] : DEFAULT_NUMBER;
    return { year, week, number };
  }

  function updateInfoWindow(year, week, number) {
    document.getElementById("week-year-line").textContent = `Week ${week} · ${year}`;
    document.getElementById("number-line").textContent = `${number.toLocaleString()} per day`;
  }

  /* =========================================================
     DOT GRID (RASTER) — drawn on canvas for performance,
     since the count can be in the tens of thousands.
     ========================================================= */
  const CELL_SIZE = 16; // size of each grid cell in px (pig emoji needs a bit more room than a plain dot)

  const canvas = document.getElementById("dot-canvas");
  const ctx = canvas.getContext("2d");

  let COLS = 1;
  let ROWS = 1;
  let COUNT = 0;
  const starred = new Set();

  const PIG_FONT = `${Math.round(CELL_SIZE * 0.95)}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;

  function drawDot(x, y) {
    const cx = x + CELL_SIZE / 2;
    const cy = y + CELL_SIZE / 2;
    ctx.font = PIG_FONT;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("🐷", cx, cy);
  }

  function drawStar(x, y) {
    const cx = x + CELL_SIZE / 2;
    const cy = y + CELL_SIZE / 2;
    const outerR = CELL_SIZE * 0.5;
    const innerR = CELL_SIZE * 0.2;
    const spikes = 5;
    let rot = (Math.PI / 2) * 3;
    const step = Math.PI / spikes;

    ctx.beginPath();
    ctx.moveTo(cx, cy - outerR);
    for (let i = 0; i < spikes; i++) {
      let sx = cx + Math.cos(rot) * outerR;
      let sy = cy + Math.sin(rot) * outerR;
      ctx.lineTo(sx, sy);
      rot += step;

      sx = cx + Math.cos(rot) * innerR;
      sy = cy + Math.sin(rot) * innerR;
      ctx.lineTo(sx, sy);
      rot += step;
    }
    ctx.lineTo(cx, cy - outerR);
    ctx.closePath();
    ctx.fillStyle = "#ffdd55";
    ctx.fill();
  }

  function cellCoords(index) {
    const col = index % COLS;
    const row = Math.floor(index / COLS);
    return { x: col * CELL_SIZE, y: row * CELL_SIZE };
  }

  function drawCell(index) {
    const { x, y } = cellCoords(index);
    ctx.clearRect(x, y, CELL_SIZE, CELL_SIZE);
    if (starred.has(index)) {
      drawStar(x, y);
    } else {
      drawDot(x, y);
    }
  }

  function renderAll() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < COUNT; i++) {
      const { x, y } = cellCoords(i);
      if (starred.has(i)) {
        drawStar(x, y);
      } else {
        drawDot(x, y);
      }
    }
  }

  function buildGrid(count) {
    COUNT = count;
    COLS = Math.max(1, Math.floor(window.innerWidth / CELL_SIZE));
    ROWS = Math.ceil(count / COLS);

    canvas.width = COLS * CELL_SIZE;
    canvas.height = ROWS * CELL_SIZE;

    starred.clear();
    renderAll();
  }

  canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const col = Math.floor(x / CELL_SIZE);
    const row = Math.floor(y / CELL_SIZE);
    const index = row * COLS + col;

    if (index >= 0 && index < COUNT && !starred.has(index)) {
      starred.add(index);
      drawCell(index);
    }
  });

  function init() {
    const { year, week, number } = getCurrentNumber();
    updateInfoWindow(year, week, number);
    buildGrid(number);
  }

  init();

  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const { number } = getCurrentNumber();
      buildGrid(number);
    }, 200);
  });
</script>

</body>
</html>
